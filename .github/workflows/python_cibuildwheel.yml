name: Python build one single wheel

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      os:
        required: true
        type: string
      arch:
        required: true
        type: string
      TESTPYPI_VERSION:
        required: true 
        type: string

jobs:

  build:
    #name: py${{ inputs.python-version }}-${{ inputs.os }}-${{ inputs.arch }}
    runs-on: ${{ inputs.os }}

    steps:
    - name: Show the context for this job
      env:
        EVENT_CONTEXT: ${{ toJSON(github.event) }}
      run: |
        echo $EVENT_CONTEXT

    - uses: actions/checkout@v4.2.2
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13.x

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install requests packaging ninja

    - name: Select Linux wheel compatibility policy
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        # Keep the historical manylinux2014 ABI for Python <=3.13.  The
        # newest NumPy wheels no longer target that baseline, so for the
        # observed 3.12/3.13 test environments install the newest compatible
        # NumPy family before the CoolProp wheel is installed.
        #
        # Python 3.14 requires the newer manylinux baseline used by current
        # NumPy wheels.  Change only that interpreter generation rather than
        # silently raising the compatibility floor for every Linux wheel.
        if [[ "${{ inputs.python-version }}" == "314" ]]; then
          echo "CIBW_MANYLINUX_X86_64_IMAGE=manylinux_2_28" >> "$GITHUB_ENV"
          echo "CIBW_MANYLINUX_AARCH64_IMAGE=manylinux_2_28" >> "$GITHUB_ENV"
        else
          echo "CIBW_MANYLINUX_X86_64_IMAGE=manylinux2014" >> "$GITHUB_ENV"
          echo "CIBW_MANYLINUX_AARCH64_IMAGE=manylinux2014" >> "$GITHUB_ENV"
        fi

        # i686 is currently excluded by the caller and remains at the legacy
        # baseline if re-enabled.
        echo "CIBW_MANYLINUX_I686_IMAGE=manylinux2014" >> "$GITHUB_ENV"

        case "${{ inputs.python-version }}" in
          312|313)
            echo "CIBW_BEFORE_TEST_LINUX=pip install 'numpy<2.3'" >> "$GITHUB_ENV"
            ;;
        esac
        
    - name: Figure out the TestPyPi/PyPi Version
      shell: bash
      run: |
        if [[ "$GITHUB_REF" == *"refs/tags"* ]]; then
          python dev/extract_version.py --pypi --replace-version
        else
          python dev/extract_version.py --replace-version --version "${{ inputs.TESTPYPI_VERSION }}"
        fi;
        
    - name: Set up QEMU
      if: ${{ runner.os == 'Linux' }}
      uses: docker/setup-qemu-action@v3.2.0
      with:
        platforms: all
        
    - name: Build and test wheels
      uses: pypa/cibuildwheel@v3.2.0
      env:
        MACOSX_DEPLOYMENT_TARGET: 11.0
        CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0 SDKROOT=/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
        CIBW_BEFORE_BUILD_LINUX: >
          pip install ninja &&
          git config --global --add safe.directory "*"
        CIBW_ENVIRONMENT_LINUX: COOLPROP_CMAKE=default,NATIVE
        CIBW_BUILD: cp${{ inputs.python-version }}-*
        CIBW_ARCHS_MACOS: ${{ inputs.arch }} # x86_64 arm64 # universal2 is redundant
        CIBW_ARCHS_WINDOWS: ${{ inputs.arch }} # AMD64 x86 # ARM64 creates problems with msgpack-c
        CIBW_ARCHS_LINUX: ${{ inputs.arch }} # i686 x86_64 aarch64 ppc64le s390x
        CIBW_TEST_COMMAND: python -c "import CoolProp; assert '?' not in CoolProp.__gitrevision__"
        # Linux manylinux image policy is selected in the preceding step.
        # CIBW_SKIP: "pp*"
        CIBW_TEST_SKIP: "*-macosx_arm64 *-win_arm64"
      with:
        package-dir: .
        output-dir: Python

    - name: Upload Files
      uses: actions/upload-artifact@v4
      with:
        name: Python-${{ inputs.os }}-${{ inputs.python-version }}-${{ inputs.arch }}
        path: |
          ./Python/*.whl
