name: QPS Darkland CoolProp Recon

on:
  pull_request:
    branches: [master]
    paths:
      - 'qps/recon/**'
      - '.github/workflows/qps_darkland_coolprop.yml'
      - 'dev/fluids/Helium.json'
      - 'src/**'
      - 'include/**'
      - 'wrappers/Python/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-qplant-helium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install "scikit-build-core>=0.10" "cython>=0.29" "numpy>=1.20"

      - name: Build and install this checkout
        run: python -m pip install --no-build-isolation .

      - name: Smoke canonical QPLANT helium points
        id: smoker
        run: python qps/recon/probe_qplant_helium.py

      - name: Bind receipt checksums
        if: always()
        run: |
          if [ -f qps/recon/receipts/coolprop_qplant_helium_smoke.json ]; then
            sha256sum qps/recon/receipts/coolprop_qplant_helium_smoke.json | tee qps/recon/receipts/SHA256SUMS
          fi

      - name: Upload exact-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qps-darkland-coolprop-${{ github.sha }}
          path: qps/recon/receipts/
          if-no-files-found: error
