name: QPS Darkland CoolProp Recon

on:
  pull_request:
    branches: [master]
    paths:
      - 'qps/recon/**'
      - '.github/workflows/qps_darkland_coolprop.yml'
      - 'dev/fluids/Helium.json'
      - 'src/**'
      - 'include/**'
      - 'wrappers/Python/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-qplant-helium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          submodules: recursive

      - name: Assert exact source head
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SOURCE_SHA}"
          echo "actual=${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SOURCE_SHA}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install "scikit-build-core>=0.10" "cython>=0.29" "numpy>=1.20"

      - name: Build and install this checkout
        run: python -m pip install --no-build-isolation .

      - name: Smoke canonical QPLANT helium points
        id: smoker
        run: python qps/recon/probe_qplant_helium.py

      - name: Execute W111 power/utility thermophysical adapter
        id: power_utility
        run: python qps/recon/probe_power_utility_thermo.py

      - name: Bind receipt checksums
        if: always()
        run: |
          mkdir -p qps/recon/receipts
          find qps/recon/receipts -maxdepth 1 -type f -name '*.json' -print0 | sort -z | xargs -0 -r sha256sum | tee qps/recon/receipts/SHA256SUMS

      - name: Upload exact-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qps-darkland-coolprop-${{ env.EXPECTED_SOURCE_SHA }}
          path: qps/recon/receipts/
          if-no-files-found: error
