name: QPS W145 LKT 2K-OP Enthalpy Crosswalk

on:
  pull_request:
    branches: [master]
    paths:
      - 'qps/recon/probe_lkt_2kop_enthalpy_crosswalk.py'
      - '.github/workflows/qps_w145_lkt_2kop_crosswalk.yml'
      - 'dev/fluids/Helium.json'
      - 'src/**'
      - 'include/**'
      - 'wrappers/Python/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lkt-2kop-crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          submodules: recursive

      - name: Assert exact source head
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SOURCE_SHA}"
          echo "actual=${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SOURCE_SHA}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install "scikit-build-core>=0.10" "cython>=0.29" "numpy>=1.20"

      - name: Build and install exact CoolProp checkout
        run: python -m pip install --no-build-isolation .

      - name: Execute exact-source W145 crosswalk
        run: python qps/recon/probe_lkt_2kop_enthalpy_crosswalk.py

      - name: Bind receipt checksum
        if: always()
        run: sha256sum qps/recon/receipts/lkt_2kop_enthalpy_crosswalk.json | tee qps/recon/receipts/W145_SHA256SUMS

      - name: Upload exact-run receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qps-w145-lkt-2kop-${{ env.EXPECTED_SOURCE_SHA }}
          path: |
            qps/recon/receipts/lkt_2kop_enthalpy_crosswalk.json
            qps/recon/receipts/W145_SHA256SUMS
          if-no-files-found: error
